{% extends "base.html" %}

{% block title %}Login - AI Resume Analyzer{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 200px);
        padding: 2rem 0;
    }
    
    .auth-card {
        width: 100%;
        max-width: 450px;
        background: var(--bg-card);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        box-shadow: var(--shadow-xl);
        animation: fadeIn 0.6s ease-out;
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .auth-title {
        font-size: 2rem;
        color: var(--primary-color);
        margin-bottom: 0.5rem;
    }
    
    .auth-subtitle {
        color: var(--text-secondary);
    }
    
    .auth-icon {
        font-size: 4rem;
        color: var(--primary-color);
        margin-bottom: 1rem;
        animation: pulse 2s ease-in-out infinite;
    }
    
    .form-checkbox {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
    }
    
    .form-checkbox input {
        width: auto;
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        color: var(--text-secondary);
    }
    
    .auth-link {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
    }
    
    .auth-link:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-user-circle"></i>
            </div>
            <h1 class="auth-title">Welcome Back!</h1>
            <p class="auth-subtitle">Login to access your resume analysis dashboard</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            {{ csrf_token() }}
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Enter your password"
                    required
                >
            </div>
            
            <div class="form-checkbox" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="{{ url_for('auth.forgot_password') }}" class="auth-link" style="font-size: 0.9rem;">
                    <i class="fas fa-question-circle"></i> Forgot Password?
                </a>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? 
                <a href="{{ url_for('auth.register') }}" class="auth-link">Register here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
